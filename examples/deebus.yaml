  #   secret: ${KLING_SECRET_KEY}
  # jimeng:
  #   type: jimeng
  #   accessKey: ${VOLC_ACCESS_KEY}
  #   secret: ${VOLC_SECRET_KEY}
  #   region: cn-north-1

primary: anthropic/claude-opus-4-6

fallbacks:
  - anthropic/claude-sonnet-4-6
  - openai/gpt-4o
  - openai/gpt-4o-mini
  - gemini/gemini-pro

timeout: 30
retry: 2
