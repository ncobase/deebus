# baseURL is optional when the provider has an official default.
providers:
  anthropic:
    type: anthropic
    apiKey: ${ANTHROPIC_API_KEY}
    baseURL: https://api.anthropic.com
  
  openai:
    type: openai
    apiKey: ${OPENAI_API_KEY}
    baseURL: https://api.openai.com
  
  gemini:
    type: gemini
    apiKey: ${GEMINI_API_KEY}
    baseURL: https://generativelanguage.googleapis.com

  # qwen:
  #   type: qwen
  #   apiKey: ${DASHSCOPE_API_KEY}
  # doubao:
  #   type: doubao
  #   apiKey: ${ARK_API_KEY}
  # hunyuan:
  #   type: hunyuan
  #   accessKey: ${TENCENT_SECRET_ID}
  #   secret: ${TENCENT_SECRET_KEY}
  #   region: ap-guangzhou
  # kling:
  #   type: kling
